<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050b16">
  <meta name="description" content="用一隻手帶動星塵、捏合成光球，再張手散開。免費互動星空，鏡頭影像只在你的瀏覽器處理。">
  <meta property="og:title" content="宇宙星塵 · 把星光握在手裡">
  <meta property="og:description" content="移動、聚合，然後放手。用手勢或滑鼠，探索指尖上的宇宙。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_HK">
  <meta property="og:url" content="https://kenjipoon.github.io/stardust/">
  <meta property="og:image" content="https://kenjipoon.github.io/stardust/preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>宇宙星塵 · 把星光握在手裡</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="universe" aria-label="可用手勢或滑鼠控制的宇宙星塵動畫"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <header class="masthead">
    <a class="brand" href="./" aria-label="宇宙星塵首頁"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2v28M2 16h28M6 6l20 20M6 26L26 6"/><circle cx="16" cy="16" r="7"/></svg><span>宇宙星塵</span></a>
    <span class="local-badge"><i></i>本機辨識<span class="badge-divider">／</span>影像不上傳</span>
  </header>
  <main>
    <section class="intro" aria-labelledby="title">
      <p class="eyebrow">一場指尖上的宇宙漫遊</p>
      <h1 id="title">把星光<br><span>握在手裡。</span></h1>
      <p class="intro-copy">移動、聚合，然後放手。<br>讓每一次微小的動作，<br>變成星空裡的一道漣漪。</p>
    </section>
    <section id="camera-panel" class="camera-panel" aria-label="鏡頭預覽">
      <div class="camera-heading"><span id="preview-title">你的視角</span><button id="preview-close" class="icon-button" aria-label="隱藏鏡頭小窗">−</button></div>
      <div class="camera-view">
        <video id="camera" autoplay playsinline muted aria-label="鏡像攝影機預覽"></video>
        <canvas id="skeleton" aria-hidden="true"></canvas>
        <div id="camera-placeholder" class="camera-placeholder"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M22 45V26a4 4 0 018 0v10-22a4 4 0 018 0v22-17a4 4 0 018 0v18-9a4 4 0 018 0v16c0 11-7 17-18 17-7 0-12-4-16-10l-8-12a4 4 0 016-5z"/></svg><span>將手放進這片星空</span><small>開啟鏡頭，開始互動</small></div>
        <div class="camera-corner c1"></div><div class="camera-corner c2"></div><div class="camera-corner c3"></div><div class="camera-corner c4"></div>
      </div>
      <p id="camera-caption">只作即時辨識 · 影像不會儲存或上傳</p>
    </section>
    <div class="orbital-note" aria-hidden="true"><span></span>讓好奇心，帶路。</div>
    <section class="instructions" aria-label="三個手勢">
      <div data-step="follow"><span class="step-no">01</span><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 16h26M8 11l-5 5 5 5m16-10 5 5-5 5"/><circle cx="16" cy="16" r="4"/></svg><div><strong>移動</strong><small>帶著星光流動</small></div></div>
      <div data-step="pinch"><span class="step-no">02</span><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 5l8 8M29 5l-8 8M3 27l8-8m18 8-8-8"/><circle cx="16" cy="16" r="3"/></svg><div><strong>捏合</strong><small>聚成一顆光球</small></div></div>
      <div data-step="burst"><span class="step-no">03</span><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2v7m0 14v7M2 16h7m14 0h7M6 6l5 5m10 10 5 5M6 26l5-5m10-10 5-5"/><circle cx="16" cy="16" r="3"/></svg><div><strong>張手</strong><small>讓星塵自由散開</small></div></div>
    </section>
    <div class="interaction-status" role="status" aria-live="polite"><i id="status-dot"></i><span id="status">星空已就緒，選擇你的玩法</span></div>
    <div id="notice" class="notice" role="alert" hidden></div>
    <nav class="controls" aria-label="互動控制">
      <button id="camera-button" class="primary"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="12" height="12" rx="3"/><path d="m15 10 6-3v10l-6-3"/></svg><span>開始鏡頭</span></button>
      <button id="mouse-button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 3 12 10-6 1-3 6z"/></svg><span>滑鼠試玩</span></button>
      <span class="control-divider"></span>
      <button id="preview-button" class="utility" aria-pressed="true" title="隱藏鏡頭小窗"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><rect x="12" y="11" width="6" height="6" rx="1"/></svg><span>隱藏小窗</span></button>
      <button id="fullscreen-button" class="utility"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>全螢幕</span></button>
    </nav>
  </main>
  <footer><span>只要一隻手，一點想像。</span><span id="quality-label">800 顆星塵</span></footer>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
